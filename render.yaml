services:
  # 1. Django Backend
  - type: web
    name: biliran-booking-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
    autoDeploy: true

  # 2. Flutter Frontend (Optional)
  - type: web
    name: biliran-booking-frontend
    env: static
    plan: free
    buildCommand: flutter build web --release
    staticPublishPath: build/web
    envVars:
      - key: FLUTTER_WEB_USE_SKIA
        value: "true"
    autoDeploy: true
